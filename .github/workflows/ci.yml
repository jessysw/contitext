name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: contitext
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: contitext_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U contitext -d contitext_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CONTITEXT_TEST_DATABASE_URL: postgresql+psycopg://contitext:ci-test-only@127.0.0.1:5432/contitext_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,release]'
      - run: pytest
      - run: python -m build
      - run: python -m twine check dist/*
