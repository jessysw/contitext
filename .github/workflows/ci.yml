name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        dependencies: ['latest']
        postgres: ['16']
        include:
          - python: '3.14'
            dependencies: 'compatibility-floor'
            postgres: '16'
          - python: '3.13'
            dependencies: 'latest'
            postgres: '18'
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: contitext
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: contitext_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U contitext -d contitext_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CONTITEXT_TEST_DATABASE_URL: postgresql+psycopg://contitext:ci-test-only@127.0.0.1:5432/contitext_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.dependencies == 'latest'
        run: python -m pip install -e '.[test,release]'
      - if: matrix.dependencies == 'compatibility-floor'
        run: python -m pip install -e '.[test,release]' -c tests/python314-compatibility.txt
      - run: python -m pip check
      - run: pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_distribution.py dist
  installation:
    name: Installed wheel and Docker Compose
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: contitext
          POSTGRES_PASSWORD: ci-install-only
          POSTGRES_DB: contitext_install_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U contitext -d contitext_install_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/check_distribution.py dist
      - name: Install the wheel and run outside the source checkout
        env:
          DATABASE_URL: postgresql+psycopg://contitext:ci-install-only@127.0.0.1:5432/contitext_install_test
        run: |
          python -m venv "$RUNNER_TEMP/native"
          "$RUNNER_TEMP/native/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          native/bin/contitext init --project demo --output native.env
          native/bin/contitext --env-file native.env migrate
          native/bin/contitext --env-file native.env admin seed --if-empty
          native/bin/contitext --env-file native.env doctor
          native/bin/contitext --env-file native.env mcp-smoke
          native/bin/contitext --env-file native.env export --output native-reader
          native/bin/contitext client-config --config-file "$RUNNER_TEMP/native.env" --executable "$RUNNER_TEMP/native/bin/contitext" > "$RUNNER_TEMP/client.json"
          native/bin/python "$GITHUB_WORKSPACE/scripts/check_hook_installation.py" --connection "$RUNNER_TEMP/client.json" --project personal/demo --directory "$RUNNER_TEMP/native-hooks"
          test -f native-reader/README.md
      - name: Fresh Compose installation from the release source artifact
        run: |
          release_dir="$RUNNER_TEMP/release-source"
          mkdir "$release_dir"
          tar -xzf dist/contitext-*.tar.gz --strip-components=1 -C "$release_dir"
          cd "$release_dir"
          python scripts/bootstrap.py --project demo
          docker compose -p contitext-ci-install up --build -d --wait
          docker compose -p contitext-ci-install config --format json | python -c 'import json,sys; s=json.load(sys.stdin)["services"]; assert not s["postgres"].get("ports"); assert all(p["host_ip"] == "127.0.0.1" for p in s["app"]["ports"])'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18791/v1/projects)" = 401
          python -c 'import json,urllib.request; s=json.load(urllib.request.urlopen("http://127.0.0.1:18791/openapi.json")); assert not any(x in p for p in s["paths"] for x in ["/admin", "/credentials", "/workspaces", "/principals"])'
          docker compose -p contitext-ci-install exec -T app contitext doctor
          docker compose -p contitext-ci-install exec -T app contitext mcp-smoke
          docker compose -p contitext-ci-install restart app
          docker compose -p contitext-ci-install up -d --wait
          docker compose -p contitext-ci-install exec -T app contitext doctor
          mkdir reader-vault
          docker compose -p contitext-ci-install --profile reader up --build -d --wait
          test -f reader-vault/README.md
          "$RUNNER_TEMP/native/bin/contitext" client-config --compose "$release_dir" --compose-project contitext-ci-install > "$RUNNER_TEMP/docker-client.json"
          cd "$RUNNER_TEMP"
          native/bin/python "$GITHUB_WORKSPACE/scripts/check_hook_installation.py" --connection "$RUNNER_TEMP/docker-client.json" --project personal/demo --directory "$RUNNER_TEMP/docker-hooks"
      - name: Remove only this disposable CI stack
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/release-source/.env" ]; then
            docker compose --project-directory "$RUNNER_TEMP/release-source" -p contitext-ci-install --profile reader down -v
          fi
  homebrew-metadata:
    name: Homebrew dependency resolution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install 'uv==0.12.5' 'packaging>=25,<27'
      - name: Rehearse formula generation against the published upgrade baseline
        run: python scripts/update_homebrew.py 0.8.3 --output formula/contitext.rb
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-baseline-formula
          path: formula/contitext.rb
  homebrew-installation:
    name: Homebrew candidate (${{ matrix.os }})
    needs: homebrew-metadata
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      EXPECT_STABLE_HOMEBREW: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jessysw/homebrew-tap
          ref: 98d87f0ac5d386d4c469fb37da7796e11b3406cf
          path: tap
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-baseline-formula
          path: baseline
      - name: Build the candidate source distribution
        run: |
          python -m pip install build
          cd source
          python -m build --sdist
      - name: Prepare a candidate formula using the local release artifact
        run: |
          python - <<'PY'
          import hashlib, re, tomllib
          from pathlib import Path
          root = Path.cwd()
          version = tomllib.loads((root/'source/pyproject.toml').read_text())['project']['version']
          artifact = next((root/'source/dist').glob('contitext-*.tar.gz'))
          formula = (root/'baseline/contitext.rb').read_text()
          formula = re.sub(r'^  url .+$', '  url "' + artifact.as_uri() + '"', formula, count=1, flags=re.M)
          formula = re.sub(r'^  sha256 .+$', '  sha256 "' + hashlib.sha256(artifact.read_bytes()).hexdigest() + '"', formula, count=1, flags=re.M)
          formula = formula.replace('  license "Apache-2.0"', '  license "Apache-2.0"\n  revision 1')
          (root/'tap/Formula/contitext.rb').write_text(formula)
          PY
          tap="$(brew --repository)/Library/Taps/jessysw/homebrew-tap"
          mkdir -p "$(dirname "$tap")"
          ln -s "$GITHUB_WORKSPACE/tap" "$tap"
      - name: Upgrade from the public baseline and verify the candidate
        run: |
          export BASE_FORMULA="$GITHUB_WORKSPACE/baseline/contitext.rb"
          export GITHUB_WORKSPACE="$GITHUB_WORKSPACE/tap"
          bash "$GITHUB_WORKSPACE/scripts/acceptance.sh"
