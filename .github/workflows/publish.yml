name: Publish to PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: contitext
          POSTGRES_PASSWORD: release-test-only
          POSTGRES_DB: contitext_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U contitext -d contitext_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CONTITEXT_TEST_DATABASE_URL: postgresql+psycopg://contitext:release-test-only@127.0.0.1:5432/contitext_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,release]'
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          PY
      - run: pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/contitext
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
