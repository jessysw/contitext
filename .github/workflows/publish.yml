name: Publish release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: contitext
          POSTGRES_PASSWORD: release-test-only
          POSTGRES_DB: contitext_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U contitext -d contitext_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CONTITEXT_TEST_DATABASE_URL: postgresql+psycopg://contitext:release-test-only@127.0.0.1:5432/contitext_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,release]'
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          PY
      - run: pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/contitext
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for the versioned PyPI ownership marker
        run: |
          python - <<'PY'
          import json, time, urllib.error, urllib.request
          from pathlib import Path
          manifest = json.loads(Path('server.json').read_text())
          package = manifest['packages'][0]
          url = f"https://pypi.org/pypi/{package['identifier']}/{package['version']}/json"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      info = json.load(response)['info']
                  assert info['version'] == package['version']
                  assert f"<!-- mcp-name: {manifest['name']} -->" in info['description']
                  print('Published PyPI version and ownership marker verified.')
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code != 404 or attempt == 11:
                      raise
                  time.sleep(10)
          PY
      - name: Install signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install verified MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive=mcp-publisher_linux_amd64.tar.gz
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --show-error --silent --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --show-error --silent --location --retry 3 "$base/$archive.sigstore.json" -o "$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Validate Registry metadata
        run: '"$RUNNER_TEMP/mcp-publisher" validate server.json'
      - name: Authenticate using GitHub OIDC
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'
      - name: Publish to MCP Registry
        run: '"$RUNNER_TEMP/mcp-publisher" publish server.json'
