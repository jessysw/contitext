[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contitext"
version = "0.5.1"
description = "Project continuity for AI agents: state, decisions, checkpoints, and handoffs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.13"
authors = [{name = "Contitext contributors"}]
keywords = ["mcp", "agents", "context", "memory", "handoff", "postgresql"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "alembic>=1.13,<2.0",
  "fastapi>=0.115,<1.0",
  "mcp>=1.30,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.9,<3.0",
  "sqlalchemy>=2.0.35,<2.1",
  "uvicorn>=0.30,<1.0",
]

[project.urls]
Homepage = "https://github.com/jessysw/contitext"
Repository = "https://github.com/jessysw/contitext"
Issues = "https://github.com/jessysw/contitext/issues"

[project.scripts]
contitext = "contitext.cli:main"
contitext-admin = "contitext.admin:main"
contitext-api = "contitext.cli:serve"
contitext-mcp = "contitext.mcp_server:main"
contitext-mcp-smoke = "contitext.mcp_smoke:main"

[project.optional-dependencies]
test = ["httpx>=0.27,<1.0", "pytest>=8.3,<9.0"]
release = ["build>=1.2,<2.0", "twine>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
