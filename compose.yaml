services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run python3 scripts/bootstrap.py}
      POSTGRES_DB: ${POSTGRES_DB:?run python3 scripts/bootstrap.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run python3 scripts/bootstrap.py}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CONTITEXT_PORT:-18791}:8000"
    command: ["sh", "-ec", "contitext migrate && contitext admin seed --if-empty && exec contitext serve --host 0.0.0.0"]
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  reader:
    profiles: [reader]
    build: .
    env_file: .env
    user: "${CONTITEXT_READER_UID:-10001}:${CONTITEXT_READER_GID:-10001}"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./reader-vault:/vault
    command: ["contitext", "export", "--output", "/vault", "--watch", "60"]
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,datetime,pathlib; m=json.loads(pathlib.Path('/vault/.contitext-reader.json').read_text()); t=datetime.datetime.fromisoformat(m['last_success']); assert not m.get('pending') and (datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()<150"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
