services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run python3 scripts/bootstrap.py}
      POSTGRES_DB: ${POSTGRES_DB:?run python3 scripts/bootstrap.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run python3 scripts/bootstrap.py}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CONTITEXT_PORT:-18791}:8000"
    command: ["sh", "-ec", "contitext migrate && contitext admin seed --if-empty && exec contitext serve --host 0.0.0.0"]
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
